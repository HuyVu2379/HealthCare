server:
  port: 8080

spring:
  application:
    name: GatewayService
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: lb://UserService
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/upload/**, /api/v1/doctors/**, /api/v1/patients/**
          filters:
            - AuthenticationFilter
        - id: health-record-service
          uri: lb://HealthRecordService
          predicates:
            - Path=/api/v1/medical-records/**, /api/v1/health-metrics/**, /api/v1/prescriptions/**, /api/v1/medical-results/**
          filters:
            - AuthenticationFilter
        - id: notification-service
          uri: lb://NotificationService
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - AuthenticationFilter
        - id: scheduling-service
          uri: lb://SchedulingService
          predicates:
            - Path=/api/v1/schedules/**, /api/v1/time-slots/**, /api/v1/doctor-schedules/**, /api/v1/appointments/**, /api/v1/predicts/**
          filters:
            - AuthenticationFilter
        - id: scheduling-service-doctor-dashboard
          uri: lb://SchedulingService
          predicates:
            - Path=/api/v1/dashboard/doctor/**
          filters:
            - AuthenticationFilter
        - id: AI_Service
          uri: lb://AI-SERVICE
          predicates:
                - Path=/api/v1/chat/**, /api/v1/analysis/**
        - id: communication-service
          uri: lb://CommunicationService
          predicates:
                - Path=/api/v1/messages/**, /api/v1/chats/**, /api/v1/calls/**,/api/communication/**, /api/v1/comments/**, /api/v1/posts/**
          filters:
            - AuthenticationFilter
        - id: communication-service-ws
          uri: lb://CommunicationService
          predicates:
            - Path=/ws/**
        #          filters:
        #                - AuthenticationFilter

        - id: payment-service-webhook
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/webhook

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationFilter
  profiles:
    active: docker
jwt:
  secretKey: ${JWT_SECRET_KEY:defaultSecretKeyForDevelopment12345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  header: Authorization
  prefix: Bearer
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
# Eureka Client Configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: gateway-service

# Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    fit.iuh.student.gatewayservice: DEBUG

---
# Docker profile configuration
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
